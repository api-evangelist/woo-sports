aid: woo-sports
name: WOO Sports
description: WOO Sports makes a sensor-based performance-tracking system for kitesurfing, wingfoiling,
  and windsurfing. The WOO 4.0 device mounts to a board and measures jump height, airtime, G-force, and
  landing impact, syncing sessions through the WOO Sports mobile apps (iOS, Android, Apple Watch, Wear OS,
  and Garmin) to a global community platform with leaderboards, spots, activity feeds, and events. More
  than 100,000 riders use WOO to track sessions and compete, including on the GKA Kite World Tour. WOO
  Sports is a Techstars-backed brand operated under Boards & More. This profile was enriched from the
  provider's public web surface; no public developer API was found (docs.woosports.com is a consumer user
  guide, not an API reference).
